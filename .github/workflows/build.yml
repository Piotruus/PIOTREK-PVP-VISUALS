name: Build mod

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11

      - name: Build with Gradle
        run: gradle build

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: PIOTREK-PVP-VISUALS-1.0
          path: build/libs/*.jar
